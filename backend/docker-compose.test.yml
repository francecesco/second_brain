# Postgres usa-e-getta per i test: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb
      POSTGRES_DB: sb_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
