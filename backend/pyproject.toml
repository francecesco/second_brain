[project]
name = "secondbrain"
version = "0.1.0"
description = "Archivio delle registrazioni di Second Brain"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<1",
  "starlette>=0.46",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "tzdata>=2024.1",
  "httpx>=0.27",
  "cryptography>=43",
  "soundfile>=0.12",
  "pyyaml>=6",
]

[project.scripts]
secondbrain = "secondbrain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
