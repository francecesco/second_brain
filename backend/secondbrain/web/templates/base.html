<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Second Brain{% endblock %}</title>
<link rel="stylesheet" href="{{ static_url('style.css') }}">
<script src="{{ static_url('htmx.min.js') }}" defer></script>
<script>
document.addEventListener("htmx:responseError", function (evt) {
  var flash = document.getElementById("flash");
  flash.textContent = evt.detail.xhr.responseText || "Errore";
  flash.hidden = false;
});
// Nota scritta salvata (new.html alza il flag all'invio): fuori da /new la bozza non serve più.
try { if (sessionStorage.getItem("sb-draft-sent") && location.pathname !== "/new") { localStorage.removeItem("sb-draft"); sessionStorage.removeItem("sb-draft-sent"); } } catch (e) {}
// Clic sul titolo di una riga: apre il dettaglio, o lo richiude se e' gia' aperto.
function toggleDetail(button) {
  var detail = document.getElementById(button.getAttribute("aria-controls"));
  if (detail.innerHTML.trim()) {
    detail.innerHTML = "";
    button.setAttribute("aria-expanded", "false");
  } else {
    button.setAttribute("aria-expanded", "true");
    htmx.ajax("GET", button.dataset.detailUrl, {target: detail});
  }
}
document.addEventListener("click", function (evt) {
  if (evt.target.id === "flash") { evt.target.hidden = true; }
  // Il menu a scomparsa si chiude cliccando fuori.
  document.querySelectorAll("details.menu[open]").forEach(function (menu) {
    if (!menu.contains(evt.target)) { menu.open = false; }
  });
});
document.addEventListener("keydown", function (evt) {
  if (evt.key === "Escape") {
    document.querySelectorAll("details.menu[open]").forEach(function (menu) {
      menu.open = false;
      menu.querySelector("summary").focus();
    });
  }
});
</script>
</head>
<body{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
<div id="flash" class="error" role="alert" hidden></div>
{% block body %}{% endblock %}
</body>
</html>
