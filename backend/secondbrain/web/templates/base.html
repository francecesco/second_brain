<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Second Brain{% endblock %}</title>
<link rel="stylesheet" href="{{ static_url('style.css') }}">
<script src="{{ static_url('htmx.min.js') }}" defer></script>
<script>
document.addEventListener("htmx:responseError", function (evt) {
  var flash = document.getElementById("flash");
  flash.textContent = evt.detail.xhr.responseText || "Errore";
  flash.hidden = false;
});
// Nota scritta salvata (/new rimanda a /todo#salvata): solo allora la bozza non serve più.
// Il segno si toglie dall'indirizzo, cosi' un ricaricamento non lo ripete.
if (location.hash === "#salvata") {
  try { localStorage.removeItem("sb-draft"); } catch (e) {}
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
// Clic sul titolo di una riga: apre il dettaglio, o lo richiude se e' gia' aperto.
// Sul desktop largo il dettaglio e' un pannello a destra (style.css): una nota aperta per volta.
var PANEL = window.matchMedia("(min-width: 1100px)");
function closeDetail(button) {
  document.getElementById(button.getAttribute("aria-controls")).innerHTML = "";
  button.setAttribute("aria-expanded", "false");
}
function toggleDetail(button) {
  var detail = document.getElementById(button.getAttribute("aria-controls"));
  if (detail.innerHTML.trim()) {
    closeDetail(button);
  } else {
    if (PANEL.matches) {
      document.querySelectorAll('.row-main[aria-expanded="true"]').forEach(closeDetail);
    }
    button.setAttribute("aria-expanded", "true");
    htmx.ajax("GET", button.dataset.detailUrl, {target: detail});
  }
}
document.addEventListener("click", function (evt) {
  if (evt.target.id === "flash") { evt.target.hidden = true; }
  // Il menu a scomparsa si chiude cliccando fuori.
  // Menu e foglio "Altro" si chiudono cliccando fuori (o sullo sfondo del foglio).
  document.querySelectorAll("details.menu[open]").forEach(function (menu) {
    if (!menu.contains(evt.target) || evt.target.classList.contains("sheet-backdrop")) { menu.open = false; }
  });
});
document.addEventListener("keydown", function (evt) {
  if (evt.key === "Escape") {
    document.querySelectorAll("details.menu[open]").forEach(function (menu) {
      menu.open = false;
      menu.querySelector("summary").focus();
    });
  }
});
</script>
</head>
<body{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
<div id="flash" class="error" role="alert" hidden></div>
{% block body %}{% endblock %}
</body>
</html>
