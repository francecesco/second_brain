{# Tessere-contatore di "Da fare" (spec UI responsive §2.6): rimandate out-of-band dalla spunta. #}
<div class="tiles" id="tiles"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <div class="tile on"><span class="lab">Da fare</span><span class="num">{{ tiles.todo }}</span></div>
  <div class="tile"><span class="lab">Oggi</span><span class="num">{{ tiles.today }}</span></div>
  <div class="tile"><span class="lab">Ultimi 7 giorni</span><span class="num">{{ tiles.week }}</span></div>
  <div class="tile"><span class="lab">In elaborazione</span><span class="num">{{ tiles.processing }}</span>{% if tiles.running %}<span class="led run" role="img" aria-label="In corso" title="In corso"></span>{% endif %}</div>
</div>
